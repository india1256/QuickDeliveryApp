name: Build 3 Quick Delivery APKs (Customer, Rider, Admin)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select which APK(s) to build (all / customer / rider / admin)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - customer
          - rider
          - admin

permissions:
  contents: write

jobs:
  build-android-apks:
    name: Cloud Build — Customer, Rider & Admin APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Configure Android SDK & Install Android 36.1 + Build Tools 36.0.0
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR"
          fi
          if [ ! -w "$SDK_DIR" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || true
          fi

          SDKMANAGER_BIN=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER_BIN="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER_BIN" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" "platforms;android-36.1" || "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --channel=1 "platforms;android-36.1" || true
          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true

      - name: 5. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 6. Prepare Signing Keystore & Build Environment
        run: |
          java -version
          gradle --version
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          mkdir -p dist-apks public/apks

      - name: 7. Compile Native Android App & Build Base APK
        run: |
          gradle :app:assembleDebug --no-daemon --console=plain
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: 8. Package & Sign Standalone Customer, Rider & Admin APKs
        run: |
          python3 scripts/build-standalone-role-apks.py
          TARGET="${{ inputs.build_target || 'all' }}"
          if [ "$TARGET" = "customer" ] || [ "$TARGET" = "all" ]; then
            cp public/apks/QuickDelivery-Customer.apk dist-apks/
          fi
          if [ "$TARGET" = "rider" ] || [ "$TARGET" = "all" ]; then
            cp public/apks/QuickDelivery-Rider-Partner.apk dist-apks/
          fi
          if [ "$TARGET" = "admin" ] || [ "$TARGET" = "all" ]; then
            cp public/apks/QuickDelivery-Admin-Enterprise.apk dist-apks/
          fi
          ls -lh dist-apks/*.apk

      - name: 9. Upload Customer APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Customer.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Customer-APK
          path: dist-apks/QuickDelivery-Customer.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 10. Upload Rider Partner APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Rider-Partner.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Rider-Partner-APK
          path: dist-apks/QuickDelivery-Rider-Partner.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 11. Upload Admin Enterprise APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Admin-Enterprise.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Admin-Enterprise-APK
          path: dist-apks/QuickDelivery-Admin-Enterprise.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 12. Upload All-APKs Combined Bundle
        if: ${{ always() && hashFiles('dist-apks/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-All-APKs-Bundle
          path: dist-apks/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 13. Prepare Release Tags for Built APKs
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist-apks/*.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "v6.3.${GITHUB_RUN_NUMBER}" -m "Quick Delivery APKs Build #${GITHUB_RUN_NUMBER}"
          git tag -fa "latest-apks" -m "Latest Quick Delivery APKs (Build #${GITHUB_RUN_NUMBER})"
          git push origin "refs/tags/v6.3.${GITHUB_RUN_NUMBER}" --force
          git push origin "refs/tags/latest-apks" --force

      - name: 14. Create Versioned GitHub Release with Built APKs
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.3.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Quick Delivery v6.3.${{ github.run_number }} — Customer, Rider & Admin APKs"
          body: |
            ## Direct 1-Tap Mobile APK Downloads (Build #${{ github.run_number }})

            1. **QuickDelivery-Customer.apk** — Customer Ordering & Live Tracking (`com.aistudio.quickdelivery.cust01`)
            2. **QuickDelivery-Rider-Partner.apk** — Rider Partner Delivery, KYC & Bank Payouts (`com.aistudio.quickdelivery.ride02`)
            3. **QuickDelivery-Admin-Enterprise.apk** — Admin Control Center (`com.aistudio.quickdelivery.admn03`)
          files: dist-apks/*.apk
          draft: false
          prerelease: false
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 15. Update Rolling 'latest-apks' GitHub Release
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apks
          target_commitish: ${{ github.sha }}
          name: "Quick Delivery (Latest) — Customer, Rider & Admin APKs"
          body: |
            ## Direct 1-Tap Mobile APK Downloads (Latest Build)

            1. **QuickDelivery-Customer.apk** (`com.aistudio.quickdelivery.cust01`)
            2. **QuickDelivery-Rider-Partner.apk** (`com.aistudio.quickdelivery.ride02`)
            3. **QuickDelivery-Admin-Enterprise.apk** (`com.aistudio.quickdelivery.admn03`)
          files: dist-apks/*.apk
          draft: false
          prerelease: false
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
