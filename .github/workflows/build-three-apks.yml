name: Build 3 Quick Delivery APKs (Customer, Rider, Admin)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select which APK(s) to build (all / customer / rider / admin)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - customer
          - rider
          - admin

permissions:
  contents: write

jobs:
  build-android-apks:
    name: Cloud Build — Customer, Rider & Admin APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Accept Android SDK Licenses & Install Web/Capacitor Dependencies
        run: |
          yes | sdkmanager --licenses || true
          rm -f capacitor.config.ts
          npm install --legacy-peer-deps --no-audit --no-fund
          mkdir -p dist-apks

      - name: 6. Build Customer App APK (QuickDelivery-Customer.apk)
        if: ${{ github.event.inputs.build_target == '' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'customer' }}
        run: |
          node scripts/build-capacitor-apk.mjs customer --apk
          ls -lh dist-apks/QuickDelivery-Customer.apk

      - name: 7. Build Rider Partner APK (QuickDelivery-Rider-Partner.apk)
        if: ${{ github.event.inputs.build_target == '' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'rider' }}
        run: |
          node scripts/build-capacitor-apk.mjs rider --apk
          ls -lh dist-apks/QuickDelivery-Rider-Partner.apk

      - name: 8. Build Admin Enterprise APK (QuickDelivery-Admin-Enterprise.apk)
        if: ${{ github.event.inputs.build_target == '' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'admin' }}
        run: |
          node scripts/build-capacitor-apk.mjs admin --apk
          ls -lh dist-apks/QuickDelivery-Admin-Enterprise.apk

      - name: 9. Build All-in-One Unified Hub APK (QuickDelivery-AllInOne-Hub.apk)
        if: ${{ github.event.inputs.build_target == '' || github.event.inputs.build_target == 'all' }}
        run: |
          node scripts/build-capacitor-apk.mjs hub --apk
          ls -lh dist-apks/QuickDelivery-AllInOne-Hub.apk

      - name: 10. Upload Customer APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Customer.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Customer-APK
          path: dist-apks/QuickDelivery-Customer.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 11. Upload Rider Partner APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Rider-Partner.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Rider-Partner-APK
          path: dist-apks/QuickDelivery-Rider-Partner.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 12. Upload Admin Enterprise APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Admin-Enterprise.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Admin-Enterprise-APK
          path: dist-apks/QuickDelivery-Admin-Enterprise.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 13. Upload All-APKs Combined Bundle
        if: ${{ always() && hashFiles('dist-apks/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-All-APKs-Bundle
          path: dist-apks/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 14. Prepare Release Tags for Built APKs
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist-apks/*.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "v5.3.${GITHUB_RUN_NUMBER}" -m "Quick Delivery APKs Build #${GITHUB_RUN_NUMBER}"
          git tag -fa "latest-apks" -m "Latest Quick Delivery APKs (Build #${GITHUB_RUN_NUMBER})"
          git push origin "refs/tags/v5.3.${GITHUB_RUN_NUMBER}" --force
          git push origin "refs/tags/latest-apks" --force

      - name: 15. Create Automatic Versioned GitHub Release with Built APKs (dist-apks/*.apk)
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "📲 Quick Delivery v5.3.${{ github.run_number }} — Customer, Rider & Admin APKs"
          body: |
            ## 📲 Direct 1-Tap Mobile APK Downloads (Build #${{ github.run_number }})

            Click any `.apk` file below under **Assets** on your Android phone to download and install directly (no `.zip` extraction required):

            1. 🛍️ **`QuickDelivery-Customer.apk`** — Customer Ordering & Live Tracking App (`com.quickdelivery.customer`)
            2. 🛵 **`QuickDelivery-Rider-Partner.apk`** — Rider Partner Delivery & Earnings App (`com.quickdelivery.rider`)
            3. 🛡️ **`QuickDelivery-Admin-Enterprise.apk`** — Admin Control Center & Order Management App (`com.quickdelivery.admin`)
            4. 🌐 **`QuickDelivery-AllInOne-Hub.apk`** — Unified 3-in-1 Switcher App (`com.quickdelivery.hub`)

            > **Note:** Each APK has a unique Android Package ID so all apps can be installed side-by-side on the same phone and sync live via Firebase Firestore.
          files: dist-apks/*.apk
          draft: false
          prerelease: false
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 16. Update Rolling 'latest-apks' GitHub Release with Built APKs (dist-apks/*.apk)
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apks
          target_commitish: ${{ github.sha }}
          name: "📲 Quick Delivery (Latest) — Direct Mobile APK Downloads (Customer, Rider & Admin)"
          body: |
            ## 📲 Direct 1-Tap Mobile APK Downloads (Always Latest Build)

            Click any `.apk` file below under **Assets** on your Android phone to download and install directly:

            1. 🛍️ **`QuickDelivery-Customer.apk`** — Customer Ordering & Live Tracking App (`com.quickdelivery.customer`)
            2. 🛵 **`QuickDelivery-Rider-Partner.apk`** — Rider Partner Delivery & Earnings App (`com.quickdelivery.rider`)
            3. 🛡️ **`QuickDelivery-Admin-Enterprise.apk`** — Admin Control Center & Order Management App (`com.quickdelivery.admin`)
            4. 🌐 **`QuickDelivery-AllInOne-Hub.apk`** — Unified 3-in-1 Switcher App (`com.quickdelivery.hub`)
          files: dist-apks/*.apk
          draft: false
          prerelease: false
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
