name: Build 3 Quick Delivery APKs (Customer, Rider, Admin)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select which APK(s) to build (all / customer / rider / admin)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - customer
          - rider
          - admin

permissions:
  contents: write

jobs:
  build-android-apks:
    name: Cloud Build — Customer, Rider & Admin APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Install Android 36 SDK & Build Tools 36.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager "platforms;android-36.1" || true

      - name: 5. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 6. Prepare Signing Keystore & Build Environment
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          mkdir -p dist-apks public/apks

      - name: 7. Compile Native Android App & Build Base APK
        run: |
          gradle :app:assembleDebug --no-daemon --console=plain
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: 8. Package & Sign Standalone Customer, Rider & Admin APKs
        run: |
          python3 scripts/build-standalone-role-apks.py
          TARGET="${{ github.event.inputs.build_target || 'all' }}"
          if [ "$TARGET" = "customer" ] || [ "$TARGET" = "all" ]; then
            cp public/apks/QuickDelivery-Customer.apk dist-apks/
          fi
          if [ "$TARGET" = "rider" ] || [ "$TARGET" = "all" ]; then
            cp public/apks/QuickDelivery-Rider-Partner.apk dist-apks/
          fi
          if [ "$TARGET" = "admin" ] || [ "$TARGET" = "all" ]; then
            cp public/apks/QuickDelivery-Admin-Enterprise.apk dist-apks/
          fi
          ls -lh dist-apks/*.apk

      - name: 9. Upload Customer APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Customer.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Customer-APK
          path: dist-apks/QuickDelivery-Customer.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 10. Upload Rider Partner APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Rider-Partner.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Rider-Partner-APK
          path: dist-apks/QuickDelivery-Rider-Partner.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 11. Upload Admin Enterprise APK Artifact
        if: ${{ always() && hashFiles('dist-apks/QuickDelivery-Admin-Enterprise.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-Admin-Enterprise-APK
          path: dist-apks/QuickDelivery-Admin-Enterprise.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 12. Upload All-APKs Combined Bundle
        if: ${{ always() && hashFiles('dist-apks/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuickDelivery-All-APKs-Bundle
          path: dist-apks/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 13. Prepare Release Tags for Built APKs
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist-apks/*.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "v6.3.${GITHUB_RUN_NUMBER}" -m "Quick Delivery APKs Build #${GITHUB_RUN_NUMBER}"
          git tag -fa "latest-apks" -m "Latest Quick Delivery APKs (Build #${GITHUB_RUN_NUMBER})"
          git push origin "refs/tags/v6.3.${GITHUB_RUN_NUMBER}" --force
          git push origin "refs/tags/latest-apks" --force

      - name: 14. Create Versioned GitHub Release with Built APKs
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.3.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Quick Delivery v6.3.${{ github.run_number }} — Customer, Rider & Admin APKs"
          body: |
            ## Direct 1-Tap Mobile APK Downloads (Build #${{ github.run_number }})

            1. **QuickDelivery-Customer.apk** — Customer Ordering & Live Tracking (`com.aistudio.quickdelivery.cust01`)
            2. **QuickDelivery-Rider-Partner.apk** — Rider Partner Delivery, KYC & Bank Payouts (`com.aistudio.quickdelivery.ride02`)
            3. **QuickDelivery-Admin-Enterprise.apk** — Admin Control Center (`com.aistudio.quickdelivery.admn03`)
          files: dist-apks/*.apk
          draft: false
          prerelease: false
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 15. Update Rolling 'latest-apks' GitHub Release
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('dist-apks/*.apk') != '' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apks
          target_commitish: ${{ github.sha }}
          name: "Quick Delivery (Latest) — Customer, Rider & Admin APKs"
          body: |
            ## Direct 1-Tap Mobile APK Downloads (Latest Build)

            1. **QuickDelivery-Customer.apk** (`com.aistudio.quickdelivery.cust01`)
            2. **QuickDelivery-Rider-Partner.apk** (`com.aistudio.quickdelivery.ride02`)
            3. **QuickDelivery-Admin-Enterprise.apk** (`com.aistudio.quickdelivery.admn03`)
          files: dist-apks/*.apk
          draft: false
          prerelease: false
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
