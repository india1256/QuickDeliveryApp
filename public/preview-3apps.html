<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quick Delivery v6.7.1 — Live 3-App Interactive Preview</title>
  <style>
    :root {
      --bg-dark: #022C22;
      --bg-navy: #0F172A;
      --emerald: #059669;
      --emerald-light: #10B981;
      --emerald-soft: #ECFDF5;
      --amber: #D97706;
      --teal: #0D9488;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B192C;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top Unified Studio Bar */
    .studio-topbar {
      background: linear-gradient(90deg, #022C22, #064E3B);
      color: #fff;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(52, 211, 153, 0.35);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .studio-top-row {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 13px;
      color: #ECFDF5;
    }
    .live-pill {
      font-size: 10px;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.22);
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #A7F3D0;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-btn {
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .top-btn:hover { background: rgba(255,255,255,0.2); }
    .top-btn.apk { background: #7C3AED; border-color: #A78BFA; }

    /* App Role Switcher Ribbon */
    .role-ribbon {
      max-width: 760px;
      margin: 8px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .role-tab {
      border: 1.5px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #D1FAE5;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 6px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .role-tab.active-CUSTOMER { background: #10B981; color: #022C22; border-color: #6EE7B7; }
    .role-tab.active-RIDER { background: #F59E0B; color: #1E293B; border-color: #FDE68A; }
    .role-tab.active-ADMIN { background: #38BDF8; color: #0F172A; border-color: #BAE6FD; }

    /* Phone Shell Container */
    .phone-stage {
      flex: 1;
      max-width: 520px;
      width: 100%;
      margin: 10px auto 14px;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
    }
    .phone-stage.wide { max-width: 820px; }
    .phone-frame {
      background: #F8FAFC;
      border-radius: 22px;
      border: 3px solid #1E293B;
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 620px;
    }

    /* Inside App Header */
    .app-header {
      background: #042F2E;
      color: #fff;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .app-header.rider { background: #1E293B; border-bottom: 2px solid #F59E0B; }
    .app-header.admin { background: #0F172A; border-bottom: 2px solid #38BDF8; }
    .app-h-left { display: flex; align-items: center; gap: 8px; }
    .menu-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
    }
    .app-name { font-weight: 800; font-size: 14px; line-height: 1.15; }
    .app-sub { font-size: 10px; color: #A7F3D0; font-weight: 600; }
    .app-h-right { display: flex; align-items: center; gap: 6px; }
    .chip-btn {
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .chip-btn.sos { background: #DC2626; border-color: #FCA5A5; }
    .chip-btn.online { background: #059669; border-color: #6EE7B7; }
    .chip-btn.offline { background: #475569; border-color: #94A3B8; }

    /* Sub-nav inside each app */
    .sub-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .sub-tab {
      border: 1px solid #CBD5E1;
      background: #F1F5F9;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .sub-tab.active {
      background: #042F2E;
      color: #fff;
      border-color: #042F2E;
    }

    /* Main Scroll Content */
    .app-body {
      padding: 10px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }
    .card-dark {
      background: #0F172A;
      color: #F8FAFC;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
    }
    .sec-title {
      font-size: 13px;
      font-weight: 800;
      color: #0F172A;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: #ECFDF5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }
    .badge.amber { background: #FEF3C7; color: #92400E; border-color: #FCD34D; }
    .badge.red { background: #FEE2E2; color: #991B1B; border-color: #FCA5A5; }
    .badge.blue { background: #E0F2FE; color: #075985; border-color: #7DD3FC; }

    label.lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
    }
    input.inp, select.inp, textarea.inp {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      font-size: 12px;
      font-family: inherit;
      background: #fff;
      color: #0F172A;
      margin-bottom: 8px;
    }
    input.inp:focus, select.inp:focus, textarea.inp:focus {
      outline: none;
      border-color: #059669;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .pill-choice {
      border: 1.5px solid #CBD5E1;
      background: #F8FAFC;
      border-radius: 10px;
      padding: 7px 6px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      color: #1E293B;
    }
    .pill-choice.selected {
      background: #ECFDF5;
      border-color: #059669;
      color: #065F46;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: #059669;
    }
    .btn.amber { background: #D97706; }
    .btn.navy { background: #0F172A; }
    .btn.blue { background: #0284C7; }
    .btn.red { background: #DC2626; }
    .btn.outline {
      background: #fff;
      color: #0F172A;
      border: 1.5px solid #CBD5E1;
    }
    .btn-sm { padding: 6px 10px; font-size: 11px; width: auto; }

    .fare-box {
      background: #ECFDF5;
      border: 1.5px solid #34D399;
      border-radius: 12px;
      padding: 10px;
      margin: 6px 0 10px;
      font-size: 12px;
    }
    .fare-line { display: flex; justify-content: space-between; margin-bottom: 3px; color: #065F46; }
    .fare-total { display: flex; justify-content: space-between; font-weight: 900; font-size: 14px; color: #022C22; border-top: 1px dashed #34D399; padding-top: 5px; margin-top: 4px; }

    .otp-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }
    .otp-card {
      background: #F1F5F9;
      border: 1px dashed #64748B;
      border-radius: 10px;
      padding: 7px;
      text-align: center;
    }
    .otp-val { font-size: 16px; font-weight: 900; letter-spacing: 2px; color: #042F2E; }

    .toast {
      position: fixed;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: #0F172A;
      color: #fff;
      border: 1.5px solid #34D399;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      z-index: 60;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 92vw;
      text-align: center;
      display: none;
    }

    /* Phone Bottom Navigation */
    .phone-bottom-nav {
      background: #fff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 5px 4px;
    }
    .bnav-btn {
      background: none;
      border: none;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      border-radius: 10px;
    }
    .bnav-btn.active {
      color: #059669;
      background: #ECFDF5;
    }

    /* Drawer / Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(2, 44, 34, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 70;
    }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 16px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.45);
    }
    .kv-list { font-size: 12px; line-height: 1.55; color: #334155; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 9px;
    }
    .stat-num { font-size: 16px; font-weight: 900; color: #0F172A; }
    .stat-lbl { font-size: 10px; font-weight: 700; color: #64748B; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #F1F5F9;
      font-size: 12px;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #94A3B8;
      padding: 6px 10px 14px;
    }
    .footer-note a { color: #6EE7B7; margin: 0 6px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="studio-topbar">
    <div class="studio-top-row">
      <div class="brand-title">
        <span>⚡ Quick Delivery v6.7.1</span>
        <span class="live-pill" id="sync-badge">● Syncing...</span>
      </div>
      <div class="top-actions">
        <button class="top-btn" onclick="toggleLang()" id="lang-btn">🌐 EN/HI</button>
        <button class="top-btn" onclick="refreshState(true)">🔄 Sync</button>
        <a class="top-btn apk" href="/?view=apks">📲 APKs</a>
      </div>
    </div>
    <div class="role-ribbon">
      <button class="role-tab active-CUSTOMER" id="top-tab-CUSTOMER" onclick="switchRole('CUSTOMER')">🛍️ Customer App</button>
      <button class="role-tab" id="top-tab-RIDER" onclick="switchRole('RIDER')">🛵 Rider Partner</button>
      <button class="role-tab" id="top-tab-ADMIN" onclick="switchRole('ADMIN')">🛡️ Admin Console</button>
    </div>
  </div>

  <div class="phone-stage" id="phone-stage">
    <div class="phone-frame">
      <div class="app-header" id="app-header">
        <div class="app-h-left">
          <button class="menu-btn" onclick="openMenuModal()">☰</button>
          <div>
            <div class="app-name" id="header-title">Quick Delivery</div>
            <div class="app-sub" id="header-sub">FAST. SIMPLE. SECURE. • Customer</div>
          </div>
        </div>
        <div class="app-h-right" id="header-right"></div>
      </div>

      <div class="sub-tabs" id="sub-tabs"></div>

      <div class="app-body" id="app-body">
        <div class="card">Loading live 3-app workspace...</div>
      </div>

      <div class="phone-bottom-nav">
        <button class="bnav-btn active" id="bot-tab-CUSTOMER" onclick="switchRole('CUSTOMER')">
          <span>🛍️</span><span>Customer</span>
        </button>
        <button class="bnav-btn" id="bot-tab-RIDER" onclick="switchRole('RIDER')">
          <span>🛵</span><span>Rider Partner</span>
        </button>
        <button class="bnav-btn" id="bot-tab-ADMIN" onclick="switchRole('ADMIN')">
          <span>🛡️</span><span>Admin Web</span>
        </button>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <a href="/privacy-policy">Privacy Policy</a> •
    <a href="/terms">Terms of Service</a> •
    <a href="/delete-account">Delete Account</a> •
    <a href="/?view=apks">4-APK Hub</a> •
    <a href="/?view=public">Public Brand Portal</a>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-bg" id="modal-bg" onclick="if(event.target===this) closeModal()">
    <div class="modal-box" id="modal-box"></div>
  </div>

<script>
const state = {
  role: 'CUSTOMER',
  lang: 'en',
  custSubTab: 'BOOK',
  riderSubTab: 'ACTIVE',
  adminSubTab: 'ORDERS',
  riderOnline: true,
  selectedVehicle: 'BIKE',
  selectedCategory: 'Documents',
  selectedWeight: 'Up to 5kg',
  paymentMethod: 'UPI_INSTANT_PAY',
  appliedCoupon: '',
  orderFilter: 'ALL',
  data: null,
  bookingDraft: {
    customerName: 'Aarav Sharma',
    customerPhone: '9876543210',
    receiverName: 'Priya Verma',
    receiverPhone: '9845098450',
    pickupAddress: 'Shop 14, MG Road, Indiranagar',
    dropAddress: 'Tower B, Koramangala 4th Block',
    distanceKm: 5.5
  },
  riderDraft: {
    riderId: 'RIDER-PREVIEW-01',
    riderName: 'Vikram Singh',
    phone: '9988776655',
    vehicleType: 'BIKE',
    vehicleNumber: 'KA-01-QD-4021'
  }
};

function t(en, hi) {
  return state.lang === 'hi' ? hi : en;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

function openModal(html) {
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-bg').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal-bg').style.display = 'none';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getFlags() {
  const f = (state.data && state.data.remoteFeatureFlags) || {};
  return {
    bikeBaseInr: Number(f.bikeBaseInr || 45),
    bikePerKmInr: Number(f.bikePerKmInr || 12),
    scooterBaseInr: Number(f.scooterBaseInr || 40),
    scooterPerKmInr: Number(f.scooterPerKmInr || 10),
    autoBaseInr: Number(f.autoBaseInr || 85),
    autoPerKmInr: Number(f.autoPerKmInr || 16),
    weightBaseInr: Number(f.weightBaseInr || 10),
    riderCodCommissionLimitInr: Number(f.riderCodCommissionLimitInr || 200),
    promoCodeEnabled: f.promoCodeEnabled !== false,
    scheduledDeliveryEnabled: f.scheduledDeliveryEnabled !== false,
    multiDropEnabled: f.multiDropEnabled !== false,
    parcelInsuranceEnabled: f.parcelInsuranceEnabled !== false,
    b2bPostpaidEnabled: Boolean(f.b2bPostpaidEnabled),
    overSpeedAlarmEnabled: f.overSpeedAlarmEnabled !== false,
    batteryGuardEnabled: f.batteryGuardEnabled !== false,
  };
}

function calcFare(vehicle, distKm, weightBracket, couponCode) {
  const fl = getFlags();
  const base = vehicle === 'SCOOTER' ? fl.scooterBaseInr : vehicle === 'AUTO' ? fl.autoBaseInr : fl.bikeBaseInr;
  const perKm = vehicle === 'SCOOTER' ? fl.scooterPerKmInr : vehicle === 'AUTO' ? fl.autoPerKmInr : fl.bikePerKmInr;
  const kmCharge = Math.round(Math.max(1, Number(distKm || 1)) * perKm);
  const weightFee = weightBracket === '15-20kg' ? fl.weightBaseInr * 2 : weightBracket === '5-15kg' ? fl.weightBaseInr : 0;
  const sub = base + kmCharge + weightFee;
  let discount = 0;
  if (couponCode && state.data && Array.isArray(state.data.promoCoupons)) {
    const found = state.data.promoCoupons.find(c => String(c.code || '').toUpperCase() === couponCode.toUpperCase() && c.active !== false);
    if (found) {
      discount = Math.min(Number(found.maxDiscountInr || 50), Math.round(sub * (Number(found.percentOff || 15) / 100)));
    }
  }
  const total = Math.max(25, sub - discount);
  const riderShare = Math.round(total * 0.80);
  const commission = total - riderShare;
  return { base, kmCharge, weightFee, discount, total, riderShare, commission };
}

async function refreshState(manual) {
  try {
    const res = await fetch('/api/preview/state', { cache: 'no-store' });
    if (!res.ok) throw new Error('Sync failed');
    state.data = await res.json();
    const ordCnt = (state.data.orders || []).length;
    document.getElementById('sync-badge').textContent = `● Live Sync • ${ordCnt} Orders`;
    renderActiveScreen();
    if (manual) showToast('✅ Live state synced with server');
  } catch (e) {
    document.getElementById('sync-badge').textContent = '● Offline';
  }
}

async function callAction(action, payload = {}) {
  try {
    const res = await fetch('/api/preview/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...payload })
    });
    const json = await res.json();
    if (!res.ok || json.ok === false) {
      showToast('❌ ' + (json.error || 'Action failed'));
      return null;
    }
    state.data = json.state;
    const ordCnt = (state.data.orders || []).length;
    document.getElementById('sync-badge').textContent = `● Live Sync • ${ordCnt} Orders`;
    renderActiveScreen();
    if (json.message) showToast(json.message);
    return json;
  } catch (err) {
    showToast('❌ Network error');
    return null;
  }
}

function toggleLang() {
  state.lang = state.lang === 'en' ? 'hi' : 'en';
  document.getElementById('lang-btn').textContent = state.lang === 'hi' ? '🌐 हिंदी' : '🌐 EN/HI';
  renderActiveScreen();
}

function switchRole(role) {
  state.role = role;
  ['CUSTOMER', 'RIDER', 'ADMIN'].forEach(r => {
    const topEl = document.getElementById('top-tab-' + r);
    const botEl = document.getElementById('bot-tab-' + r);
    topEl.className = 'role-tab' + (r === role ? ' active-' + r : '');
    botEl.className = 'bnav-btn' + (r === role ? ' active' : '');
  });
  const stage = document.getElementById('phone-stage');
  stage.className = 'phone-stage' + (role === 'ADMIN' ? ' wide' : '');
  renderActiveScreen();
}

function openMenuModal() {
  const roleLabel = state.role === 'CUSTOMER' ? 'Customer App' : state.role === 'RIDER' ? 'Rider Partner App' : 'Admin Console';
  openModal(`
    <div class="sec-title"><span>☰ ${roleLabel} • Menu &amp; Settings</span><button class="btn btn-sm outline" onclick="closeModal()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" onclick="switchRole('CUSTOMER');state.custSubTab='BOOK';closeModal();renderActiveScreen()">🛍️ Customer — Book Parcel</button>
      <button class="btn outline" onclick="switchRole('CUSTOMER');state.custSubTab='TRACK';closeModal();renderActiveScreen()">📍 Customer — Live Order Tracking</button>
      <button class="btn outline" onclick="switchRole('CUSTOMER');state.custSubTab='HISTORY';closeModal();renderActiveScreen()">🧾 Customer — Order History &amp; GST Receipts</button>
      <button class="btn amber" onclick="switchRole('RIDER');state.riderSubTab='ACTIVE';closeModal();renderActiveScreen()">🛵 Rider Partner — Active Trips</button>

function openSupportModal() {

async function submitSupportTicket() {
  const msg = document.getElementById('sup-msg').value.trim();
  const oid = document.getElementById('sup-oid').value.trim();
  if (!msg) return showToast('⚠️ Please describe your issue');
  await callAction('SUBMIT_SUPPORT_TICKET', {
    role: state.role,
    orderId: oid,
    message: msg,
    contactName: state.role === 'RIDER' ? state.riderDraft.riderName : state.bookingDraft.customerName,
    contactPhone: state.role === 'RIDER' ? state.riderDraft.phone : state.bookingDraft.customerPhone
  });
  closeModal();
}

async function bookOrder() {
  const b = state.bookingDraft;
  if (!b.pickupAddress.trim() || !b.dropAddress.trim()) {
    return showToast('⚠️ Pickup & Drop address required');
  }
  const res = await callAction('BOOK_ORDER', {
    ...b,
    vehicleType: state.selectedVehicle,
    packageCategory: state.selectedCategory,
    weightBracket: state.selectedWeight,
    paymentMethod: state.paymentMethod,
    promoCode: state.appliedCoupon
  });
  if (res && res.ok) {
    state.custSubTab = 'TRACK';
    renderActiveScreen();
  }
}

async function cancelOrderPrompt(orderId) {
  openModal(`
    <div class="sec-title"><span>Cancel Order #${esc(orderId)}?</span><button class="btn btn-sm outline" onclick="closeModal()">✕</button></div>
    <label class="lbl">Reason for cancellation</label>
    <input class="inp" id="cancel-reason" value="Changed pickup timing" />
    <div class="row-2">
      <button class="btn outline" onclick="closeModal()">Keep Order</button>
      <button class="btn red" onclick="confirmCancel('${esc(orderId)}')">Confirm Cancel</button>
    </div>
  `);
}

async function confirmCancel(orderId) {
  const reason = document.getElementById('cancel-reason').value.trim() || 'Cancelled by Customer';
  await callAction('CANCEL_ORDER', { orderId, reason });
  closeModal();
}

async function rateOrder(orderId) {

}

async function sendChatMsg(orderId, senderRole) {
  const txt = document.getElementById('chat-inp').value.trim();

    orderId,

    senderName: senderRole === 'RIDER' ? state.riderDraft.riderName : state.bookingDraft.customerName,

              <div style="font-size:11px;color:#475569;margin:3px 0;">Pickup: ${esc(o.pickupFullAddress)} → Drop: ${esc(o.dropFullAddress)}</div>
              <div class="row-2" style="margin-top:6px;">
                <button class="btn" onclick="callAction('RIDER_ACCEPT_ORDER',{orderId:'${esc(o.orderId)}',riderId:state.riderDraft.riderId,riderName:state.riderDraft.riderName,riderVehicle:state.riderDraft.vehicleNumber})">✅ Accept Order</button>
                <button class="btn red" onclick="callAction('RIDER_REJECT_ORDER',{orderId:'${esc(o.orderId)}',riderId:state.riderDraft.riderId,reason:'Traffic / Busy'})">✕ Reject</button>
              </div>
            </div>
          `).join('')
        }
      </div>
    `;
  } else if (state.riderSubTab === 'WALLET') {
    const payouts = (state.data && state.data.withdrawalRequests) || [];
    body.innerHTML = `
      <div class="card">
        <div class="sec-title"><span>💰 Partner Wallet &amp; Instant UPI Payout</span></div>
        <div class="stat-grid" style="margin-bottom:10px;">
          <div class="stat-box"><div class="stat-num" style="color:#059669;">₹${totalNet}</div><div class="stat-lbl">Available Balance</div></div>
          <div class="stat-box"><div class="stat-num">${payouts.length}</div><div class="stat-lbl">Payout Requests</div></div>
        </div>
        <label class="lbl">Verified UPI ID for Payout</label>
        <input class="inp" id="rider-upi" value="vikram.rider@okaxis" />
        <button class="btn" onclick="callAction('RIDER_WITHDRAW_PAYOUT',{riderId:state.riderDraft.riderId,riderName:state.riderDraft.riderName,amountInr:Math.max(100,${totalNet}),upiId:document.getElementById('rider-upi').value})">⚡ Request Instant UPI Payout</button>
        <div style="margin-top:10px;font-size:12px;">
          ${payouts.map(w => `<div style="padding:5px 0;border-bottom:1px solid #F1F5F9;"><b>#${esc(w.requestId)}</b> • ₹${esc(w.amountInr)} → ${esc(w.upiId)} <span class="badge ${w.status==='PAID'?'':'amber'}">${esc(w.status)}</span></div>`).join('')}
        </div>
      </div>
    `;
  } else if (state.riderSubTab === 'KYC') {
    const regs = (state.data && state.data.riderRegistrations) || [];
    body.innerHTML = `
      <div class="card">
        <div class="sec-title"><span>🪪 Rider KYC &amp; Onboarding</span></div>
        <label class="lbl">Rider Full Name</label>
        <input class="inp" value="${esc(state.riderDraft.riderName)}" oninput="state.riderDraft.riderName=this.value" />
        <label class="lbl">Mobile Number</label>
        <input class="inp" value="${esc(state.riderDraft.phone)}" oninput="state.riderDraft.phone=this.value" />
        <div class="row-2">
          <div>
            <label class="lbl">Vehicle Type</label>
            <select class="inp" onchange="state.riderDraft.vehicleType=this.value">
              <option value="BIKE">BIKE</option><option value="SCOOTER">SCOOTER</option><option value="AUTO">AUTO</option>
            </select>
          </div>
          <div>
            <label class="lbl">Vehicle Plate</label>
            <input class="inp" value="${esc(state.riderDraft.vehicleNumber)}" oninput="state.riderDraft.vehicleNumber=this.value" />
          </div>
        </div>
        <button class="btn amber" onclick="callAction('RIDER_REGISTER_KYC', state.riderDraft)">Submit KYC to Admin Approval</button>
        <div style="margin-top:10px;font-size:12px;">
          <b>Submitted KYC Status:</b>
          ${regs.map(r => `<div style="padding:5px 0;border-bottom:1px solid #F1F5F9;"><b>${esc(r.riderName)}</b> (${esc(r.vehicleNumber)}) — <span class="badge">${esc(r.status)}</span></div>`).join('') || '<div style="color:#64748B;">No KYC submitted yet.</div>'}
        </div>
      </div>
    `;
  } else {
    body.innerHTML = `<div class="card"><div class="sec-title">Rider Support &amp; Safety</div><button class="btn" onclick="openSupportModal()">+ Report Issue / SOS Alert</button></div>`;
  }
}

async function toggleRiderDuty() {
  state.riderOnline = !state.riderOnline;
  await callAction('RIDER_TOGGLE_DUTY', { riderId: state.riderDraft.riderId, online: state.riderOnline });
}
async function verifyPickupOtp(orderId) {
  const otp = document.getElementById('potp-' + orderId).value.trim();
  await callAction('RIDER_VERIFY_PICKUP_OTP', { orderId, otp, senderName: state.bookingDraft.customerName });
}
async function verifyDropOtp(orderId) {
  const otp = document.getElementById('dotp-' + orderId).value.trim();
  await callAction('RIDER_VERIFY_DROP_OTP', { orderId, otp, receiverName: state.bookingDraft.receiverName });
}

function renderAdminBody() {
  const body = document.getElementById('app-body');
  const d = state.data || {};
  const orders = d.orders || [];
  const fl = getFlags();

  if (state.adminSubTab === 'ORDERS') {
    const filtered = orders.filter(o => {
      if (state.orderFilter === 'ALL') return true;
      if (state.orderFilter === 'SEARCHING') return o.orderStatus === 'SEARCHING_RIDER';
      if (state.orderFilter === 'DELIVERED') return o.orderStatus === 'DELIVERED';
      return !['DELIVERED', 'CANCELLED', 'SEARCHING_RIDER'].includes(o.orderStatus);
    });
    body.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-num">${orders.length}</div><div class="stat-lbl">Total Orders</div></div>
        <div class="stat-box"><div class="stat-num" style="color:#059669;">${(d.connectedDevices || []).length}</div><div class="stat-lbl">Live Connected Devices</div></div>
      </div>
      <div class="card">
        <div class="sec-title">
          <span>📦 Live Orders &amp; Dispatch Monitor</span>
          <button class="btn red btn-sm" onclick="callAction('ADMIN_RESET_ORDERS')">Reset Test Orders</button>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;">
          ${['ALL', 'SEARCHING', 'ACTIVE', 'DELIVERED'].map(f =>
            `<button class="sub-tab ${state.orderFilter === f ? 'active' : ''}" onclick="state.orderFilter='${f}';renderActiveScreen()">${f}</button>`
          ).join('')}
        </div>
        ${filtered.length === 0 ? `<p style="font-size:12px;color:#64748B;">No orders match filter.</p>` :
          filtered.map(o => `
            <div style="padding:8px 0;border-top:1px solid #F1F5F9;font-size:12px;">
              <div style="display:flex;justify-content:space-between;"><b>#${esc(o.orderId)} • ${esc(o.customerName)}</b><span class="badge">${esc(o.orderStatus)}</span></div>
              <div style="color:#475569;">${esc(o.pickupFullAddress)} → ${esc(o.dropFullAddress)}</div>
              <div>Fare: <b>${esc(o.totalFare)}</b> • Pickup OTP: <b>${esc(o.pickupOtp)}</b> • Drop OTP: <b>${esc(o.deliveryOtp)}</b></div>
            </div>
          `).join('')
        }
      </div>
    `;
  } else if (state.adminSubTab === 'PRICING') {
    body.innerHTML = `
      <div class="card">
        <div class="sec-title"><span>⚙️ Dynamic Fare &amp; Feature Flags (Synced Live)</span></div>
        <div class="row-2">
          <div><label class="lbl">Bike Base (₹)</label><input class="inp" id="fl-bb" type="number" value="${fl.bikeBaseInr}" /></div>
          <div><label class="lbl">Bike ₹/km</label><input class="inp" id="fl-bk" type="number" value="${fl.bikePerKmInr}" /></div>
          <div><label class="lbl">Scooter Base (₹)</label><input class="inp" id="fl-sb" type="number" value="${fl.scooterBaseInr}" /></div>
          <div><label class="lbl">Scooter ₹/km</label><input class="inp" id="fl-sk" type="number" value="${fl.scooterPerKmInr}" /></div>
          <div><label class="lbl">Auto Base (₹)</label><input class="inp" id="fl-ab" type="number" value="${fl.autoBaseInr}" /></div>
          <div><label class="lbl">Auto ₹/km</label><input class="inp" id="fl-ak" type="number" value="${fl.autoPerKmInr}" /></div>
          <div><label class="lbl">Weight Handling (₹)</label><input class="inp" id="fl-wb" type="number" value="${fl.weightBaseInr}" /></div>
          <div><label class="lbl">Rider COD Cap (₹)</label><input class="inp" id="fl-cod" type="number" value="${fl.riderCodCommissionLimitInr}" /></div>
        </div>
        <div class="toggle-row"><span>Promo Coupons Enabled</span><input type="checkbox" id="fl-promo" ${fl.promoCodeEnabled?'checked':''} /></div>
        <div class="toggle-row"><span>Scheduled Delivery</span><input type="checkbox" id="fl-sched" ${fl.scheduledDeliveryEnabled?'checked':''} /></div>
        <div class="toggle-row"><span>Parcel Insurance</span><input type="checkbox" id="fl-ins" ${fl.parcelInsuranceEnabled?'checked':''} /></div>
        <div class="toggle-row"><span>Over-speed 50km/h Alarm</span><input type="checkbox" id="fl-spd" ${fl.overSpeedAlarmEnabled?'checked':''} /></div>
        <div class="toggle-row"><span>Rider Battery Guard (≤20%)</span><input type="checkbox" id="fl-bat" ${fl.batteryGuardEnabled?'checked':''} /></div>
        <button class="btn blue" style="margin-top:10px;" onclick="saveAdminFlags()">💾 Save &amp; Sync Pricing to Customer &amp; Rider</button>
      </div>
    `;
  } else if (state.adminSubTab === 'COUPONS') {
    const coupons = d.promoCoupons || [];
    body.innerHTML = `
      <div class="card">
        <div class="sec-title"><span>🏷️ Promo Coupons Manager</span></div>
        <div class="row-3">
          <input class="inp" id="cp-code" placeholder="Code (SAVE20)" value="SAVE20" />
          <input class="inp" id="cp-pct" type="number" placeholder="% Off" value="20" />
          <input class="inp" id="cp-max" type="number" placeholder="Max ₹" value="40" />
        </div>
        <button class="btn" onclick="callAction('ADMIN_SAVE_COUPON',{code:document.getElementById('cp-code').value,percentOff:Number(document.getElementById('cp-pct').value),maxDiscountInr:Number(document.getElementById('cp-max').value)})">+ Create &amp; Sync Coupon</button>
        <div style="margin-top:10px;font-size:12px;">
          ${coupons.map(c => `<div style="padding:6px 0;border-top:1px solid #F1F5F9;"><b>${esc(c.code)}</b> — ${esc(c.percentOff)}% off (Max ₹${esc(c.maxDiscountInr)})</div>`).join('') || '<div style="color:#64748B;">No active coupons yet.</div>'}
        </div>
      </div>
    `;
  } else if (state.adminSubTab === 'RIDERS') {
    const regs = d.riderRegistrations || [];
    const payouts = d.withdrawalRequests || [];
    body.innerHTML = `
      <div class="card">
        <div class="sec-title"><span>🪪 Rider KYC Approval Desk (${regs.length})</span></div>
        ${regs.map(r => `
          <div style="padding:8px 0;border-top:1px solid #F1F5F9;font-size:12px;">
            <div><b>${esc(r.riderName)}</b> (${esc(r.vehicleType)} • ${esc(r.vehicleNumber)}) <span class="badge">${esc(r.status)}</span></div>
            <div style="display:flex;gap:6px;margin-top:5px;">
              <button class="btn btn-sm" onclick="callAction('ADMIN_REVIEW_RIDER',{riderKey:'${esc(r.riderKey)}',status:'APPROVED'})">✓ Approve</button>
              <button class="btn red btn-sm" onclick="callAction('ADMIN_REVIEW_RIDER',{riderKey:'${esc(r.riderKey)}',status:'REJECTED'})">✕ Reject</button>
            </div>
          </div>
        `).join('') || '<p style="font-size:12px;color:#64748B;">No pending rider KYC submissions. Submit one from Rider Partner → KYC Docs.</p>'}
      </div>
      <div class="card">
        <div class="sec-title"><span>💸 Partner UPI Payout Requests (${payouts.length})</span></div>
        ${payouts.map(w => `
          <div style="padding:8px 0;border-top:1px solid #F1F5F9;font-size:12px;display:flex;justify-content:space-between;align-items:center;">
            <div><b>${esc(w.riderName)}</b> • ₹${esc(w.amountInr)} (${esc(w.upiId)}) <span class="badge">${esc(w.status)}</span></div>
            ${w.status !== 'PAID' ? `<button class="btn btn-sm" onclick="callAction('ADMIN_APPROVE_WITHDRAWAL',{requestId:'${esc(w.requestId)}'})">Mark Paid</button>` : ''}
          </div>
        `).join('') || '<p style="font-size:12px;color:#64748B;">No payout requests yet.</p>'}
      </div>
    `;
  } else {
    const tickets = d.supportTickets || [];
    const sec = d.securityStats || {};
    body.innerHTML = `
      <div class="card">
        <div class="sec-title"><span>🛡️ Security &amp; Compliance Guard</span><span class="badge">ACTIVE</span></div>
        <div class="kv-list">
          <div>Blocked Fake Orders: <b>${sec.blockedFakeOrders || 0}</b> • Rate-Limited: <b>${sec.rateLimitedRequests || 0}</b></div>
          <div style="margin-top:6px;"><a href="/privacy-policy">Privacy Policy</a> • <a href="/terms">Terms of Service</a> • <a href="/delete-account">Delete Account</a></div>
        </div>
      </div>
      <div class="card">
        <div class="sec-title"><span>🛟 Support &amp; SOS Tickets (${tickets.length})</span></div>
        ${tickets.map(tk => `
          <div style="padding:8px 0;border-top:1px solid #F1F5F9;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div><b>#${esc(tk.ticketId)} (${esc(tk.role)})</b>: ${esc(tk.message)} <span class="badge">${esc(tk.status)}</span></div>
            ${tk.status !== 'RESOLVED' ? `<button class="btn btn-sm" onclick="callAction('ADMIN_RESOLVE_TICKET',{ticketId:'${esc(tk.ticketId)}'})">Resolve</button>` : ''}
          </div>
        `).join('') || '<p style="font-size:12px;color:#64748B;">No open support tickets.</p>'}
      </div>
    `;
  }
}

async function saveAdminFlags() {
  await callAction('ADMIN_UPDATE_FLAGS', {
    bikeBaseInr: Number(document.getElementById('fl-bb').value),
    bikePerKmInr: Number(document.getElementById('fl-bk').value),
    scooterBaseInr: Number(document.getElementById('fl-sb').value),
    scooterPerKmInr: Number(document.getElementById('fl-sk').value),
    autoBaseInr: Number(document.getElementById('fl-ab').value),
    autoPerKmInr: Number(document.getElementById('fl-ak').value),
    weightBaseInr: Number(document.getElementById('fl-wb').value),
    riderCodCommissionLimitInr: Number(document.getElementById('fl-cod').value),
    promoCodeEnabled: document.getElementById('fl-promo').checked,
    scheduledDeliveryEnabled: document.getElementById('fl-sched').checked,
    parcelInsuranceEnabled: document.getElementById('fl-ins').checked,
    overSpeedAlarmEnabled: document.getElementById('fl-spd').checked,
    batteryGuardEnabled: document.getElementById('fl-bat').checked
  });
}

refreshState(false);
setInterval(() => refreshState(false), 6000);
</script>
</body>
</html>
