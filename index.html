<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Quick Delivery — Customer, Rider & Admin Unified Hub</title>
    
    <!-- PWA Static Manifest & Theme Color for PWABuilder & APK generation -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#042F2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quick Delivery" />
    <meta name="application-name" content="Quick Delivery" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var appParam = (params.get('app') || '').toLowerCase();
          var manifestHref = '/manifest.json';
          var themeColor = '#064e3b';
          var appTitle = 'Quick Delivery — Customer, Rider & Admin Unified Hub';

          if (appParam === 'customer') {
            manifestHref = '/manifest-customer.json';
            themeColor = '#064e3b';
            appTitle = 'Quick Delivery';
          } else if (appParam === 'rider' || appParam === 'partner') {
            manifestHref = '/manifest-rider.json';
            themeColor = '#0f172a';
            appTitle = 'Quick Delivery Partner';
          } else if (appParam === 'admin' || appParam === 'enterprise') {
            manifestHref = '/manifest-admin.json';
            themeColor = '#042f2e';
            appTitle = 'QD Admin Enterprise';
          }

          document.title = appTitle;

          // Manifest Link
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.id = 'pwa-manifest-link';
          link.href = manifestHref;
          document.head.appendChild(link);

          // Theme Color Meta
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.id = 'pwa-theme-color-meta';
          meta.content = themeColor;
          document.head.appendChild(meta);
        } catch (e) {
          console.warn('[PWA] Error dynamically configuring manifest:', e);
        }
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quick Delivery" />
    <meta name="application-name" content="Quick Delivery" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #f4f9f9;
        color: #1a2e35;
        overscroll-behavior-y: contain;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[PWA] Service Worker registered successfully with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
